<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual Robot Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            margin: 0;
        }

        canvas {
            border: 1px solid black;
        }

        .controls {
            margin-top: 10px;
        }

        .controls button {
            margin: 0 5px;
        }
    </style>
    <script src="dist/main.js"></script>
</head>

<body>
    <h1>Simulator Robot System</h1>
    <canvas id="simulator" width="600" height="400"></canvas>
    <div class="controls">
        <button id="moveUp">Up</button>
        <button id="moveLeft">Left</button>
        <button id="moveRight">Right</button>
        <button id="moveDown">Down</button>
        <button id="rotateLeft">Rotate Left</button>
        <button id="rotateRight">Rotate Right</button>
        <button id="createObstacles">Create Obstacles</button>
        <button id="clearObstacles">Clear Obstacles</button>
    </div>
    <!-- Removed the script block at the bottom of the body -->
</body>

</html>
